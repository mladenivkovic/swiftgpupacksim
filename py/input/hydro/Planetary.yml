
metadata:
  flavour: Planetary
  authors: "2016 Matthieu Schaller (schaller@strw.leidenuniv.nl) & 2018   Jacob Kegerreis (jacob.kegerreis@durham.ac.uk)"
  doc: |
    Minimal conservative implementation of SPH (Particle definition)

    The thermal variable is the internal energy (u). Simple constant
    viscosity term with the Balsara (1995) switch (optional).
    No thermal conduction term is implemented.

    This corresponds to equations (43), (44), (45), (101), (103)  and (104) with
    \f$\beta=3\f$ and \f$\alpha_u=0\f$ of Price, D., Journal of Computational
    Physics, 2012, Volume 231, Issue 3, pp. 759-794.
  includes_add:
    - equation_of_state.h


# now for the actual particle content
part:
  doc: | 
    Particle fields for the SPH particles

    The density and force substructures are used to contain variables only used
    within the density and force loops over neighbours. All more permanent
    variables should be declared in the main part of the part structure,

  id: 
    type: long long
    doc:  Particle unique ID

  gpart:
    type: struct gpart*
    doc:  Pointer to corresponding gravity part

  x:
    type: double
    size: 3
    doc: the particle position

  h:
    doc: Particle smoothing length

  v:
    size: 3
    doc: Particle predicted velocity

  a_hydro:
    size: 3
    doc: Particle acceleration 

  mass:
    doc: Particle mass

  u:
    doc: Particle internal energy

  u_dt:
    doc: Time derivative of the internal energy

  rho:
    doc: Particle density

  union1:
    type: union
    doc: Store density/force specific stuff
    contents:
      density:
        type: struct
        doc: |
             Structure for the variables only used in the density loop over neighbours 

             Quantities in this sub-structure should only be accessed in the density loop 
             over neighbours and the ghost task
        contents:
          wcount:
            doc: Neighbour number count
          wcount_dh:
            doc: Derivative of the neighbour number with respect to h
          rho_dh:
            doc: Derivative of density with respect to h
          div_v:
            doc: Velocity divergence 
          rot_v:
            doc: Particle velocity curl
            size: 3
      force:
        type: struct
        doc: |
            Structure for the variables only used in the force loop over neighbours 

            Quantities in this sub-structure should only be accessed in the force loop 
            over neighbours and the ghost, drift and kick tasks
        contents:
          f_gradh:
            doc: "'Grad h' term"
          pressure:
            doc: Particle pressure
          soundspeed: 
            doc: Particle soundspeed
          v_sig:
            doc: Particle signal velocity
          h_dt: 
            doc: Time derivative of smoothing length
          balsara:
            doc: Balsara switch 

  adaptive_softening_data:
    type: struct adaptive_softening_part_data
    doc: Additional data used for adaptive softening

  mhd_data:
    type: struct mhd_part_data
    doc: Additional data used by the MHD scheme

  chemistry_data:
    type: struct chemistry_part_data 
    doc: Chemistry information

  cooling_data:
    type: struct cooling_part_data
    doc: Cooling information

  feedback_data:
    type: struct feedback_part_data
    doc: Additional data used by the feedback

  black_holes_data:
    type: struct black_holes_part_data
    doc: Black holes information (e.g. swallowing ID)

  sink_data:
    type: struct sink_part_data
    doc: Sink information (e.g. swallowing ID)

  pressure_floor_data:
    type: struct pressure_floor_part_data
    doc: Additional data used by the pressure floor

  mat_id:
    type: enum eos_planetary_material_id
    doc: Material identifier flag

  rt_data:
    type: struct rt_part_data
    doc: Additional Radiative Transfer Data

  rt_time_data:
    type: struct rt_timestepping_data
    doc: RT sub-cycling time stepping data

  geometry:
    type: struct fvpm_geometry_struct
    doc: Geometrical quantities used for Finite Volume Particle Method RT

  depth_h:
    type: char
    doc: Tree-depth at which size / 2 <= h * gamma < size

  time_bin:
    type: timebin_t
    doc: Time-step length

  timestep_limiter:
    type: struct timestep_limiter_data
    doc: Time-step limiter information

  ti_drift:
    type: integertime_t
    doc: Time of the last drift
    ifdef: SWIFT_DEBUG_CHECKS

  ti_kick:
    type: integertime_t
    doc: Time of the last drift
    ifdef: SWIFT_DEBUG_CHECKS

  N_density:
    type: int
    doc: Integer number of neighbours in the density loop
    ifdef: SWIFT_HYDRO_DENSITY_CHECKS

  N_density_exact:
    type: int
    doc: Exact integer number of neighbours in the density loop
    ifdef: SWIFT_HYDRO_DENSITY_CHECKS

  N_gradient:
    type: int
    doc: Integer number of neighbours in the gradient loop
    ifdef: SWIFT_HYDRO_DENSITY_CHECKS

  N_gradient_exact:
    type: int
    doc: Exact integer number of neighbours in the gradient loop
    ifdef: SWIFT_HYDRO_DENSITY_CHECKS

  N_force:
    type: int
    doc: Integer number of neighbours in the force loop
    ifdef: SWIFT_HYDRO_DENSITY_CHECKS

  N_force_exact:
    type: int
    doc: Exact integer number of neighbours in the force loop
    ifdef: SWIFT_HYDRO_DENSITY_CHECKS

  rho_exact:
    type: float
    doc: Exact value of the density field obtained via brute-force loop
    ifdef: SWIFT_HYDRO_DENSITY_CHECKS

  n_density:
    type: float
    doc: Weighted number of neighbours in the density loop
    ifdef: SWIFT_HYDRO_DENSITY_CHECKS

  n_density_exact:
    type: float
    doc: Exact value of the weighted number of neighbours in the density loop
    ifdef: SWIFT_HYDRO_DENSITY_CHECKS

  n_gradient:
    type: float
    doc: Weighted number of neighbours in the gradient loop
    ifdef: SWIFT_HYDRO_DENSITY_CHECKS

  n_gradient_exact:
    type: float
    doc: Exact value of the weighted number of neighbours in the gradient loop
    ifdef: SWIFT_HYDRO_DENSITY_CHECKS

  n_force:
    type: float
    doc: Weighted number of neighbours in the force loop
    ifdef: SWIFT_HYDRO_DENSITY_CHECKS

  n_force_exact:
    type: float
    doc: Exact value of the weighted number of neighbours in the force loop
    ifdef: SWIFT_HYDRO_DENSITY_CHECKS

  inhibited_exact:
    type: char
    doc: Has this particle interacted with any unhibited neighbour?
    ifdef: SWIFT_HYDRO_DENSITY_CHECKS

  limited_part:
    type: char
    doc: Has this particle been woken up by the limiter?
    ifdef: SWIFT_HYDRO_DENSITY_CHECKS

  s_fixed:
    type: float
    doc: PLANETARY_FIXED_ENTROPY



xpart:
  doc: |
    Particle fields not needed during the SPH loops over neighbours.

    This structure contains the particle fields that are not used in the
    density or force loops. Quantities should be used in the kick, drift and
    potentially ghost tasks only.

  x_diff:
    size: 3
    doc: "Offset between current position and position at last tree rebuild."

  x_diff_sort:
    size: 3
    doc: "Offset between the current position and position at the last sort."

  v_full:
    size: 3
    doc: "Velocity at the last full step."

  a_grav:
    size: 3
    doc: "Gravitational acceleration at the end of the last step"

  u_full:
    doc: "Internal energy at the last full step."

  extra_split_data:
    type: struct particle_splitting_data
    doc: "Additional data used to record particle splits"

  extra_cooling_data:
    type: struct cooling_xpart_data
    doc: "Additional data used to record cooling information"

  extra_tracers_data:
    type: struct tracers_xpart_data
    doc: "Additional data used by the tracers"

  extra_sf_data:
    type: struct star_formation_xpart_data
    doc: "Additional data used by the tracers"

  extra_feedback_data:
    type: struct feedback_xpart_data
    doc: "Additional data used by the feedback"

  extra_mhd_data:
    type: struct mhd_xpart_data
    doc: "Additional data used by the MHD scheme"

  extra_forcing_data:
    type: struct forcing_xpart_data
    doc: "Additional data used by the forcing scheme"

  csds_data:
    type: struct csds_part_data
    doc: "Additional data for the particle csds"
    ifdef: WITH_CSDS
