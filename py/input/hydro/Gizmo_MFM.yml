# First, some metadata about this SPH flavour.
metadata:
  flavour: "Gizmo-MFM"
  authors: 2014 Bert Vandenbroucke (bert.vandenbroucke@ugent.be)
  doc: Gizmo Meshless-Finite-Mass implementation

# now for the actual particle content
part:
  id: 
    type: long long
    doc:  Particle unique ID

  gpart:
    type: struct gpart*
    doc:  Pointer to corresponding gravity part

  x:
    type: double
    size: 3
    doc: the particle position

  union_v:
    type: union
    doc: |
      In MFM, the particle and fluid velocities are the same.
      We use an anonymous union to make sure we can reference the
      same array with both names.
    contents:
      v:
        size: 3
        doc: Particle predicted velocity
      fluid_v:
        size: 3
        doc: Fluid velocity

  a_hydro:
    size: 3
    doc: Particle acceleration 

  h:
    doc: Particle smoothing length

  rho:
    doc: Particle density

  P:
    doc: Pressure

  union1:
    type: union
    contents:
      density:
        type: struct
        doc: Quantities used during the volume (=density) loop.
        contents:
          wcount:
            doc: Neighbour number count
          wcount_dh:
            doc: Derivative of the neighbour number with respect to h

      limiter:
        type: struct
        doc: Quantities needed eby the slope limiter
        contents:
          limiter_rho:
            doc: Extreme values of the density among the neighbours.
            size: 2
          limiter_v:
            size: 3,2
            doc: Extreme values of the fluid velocity among the neighbours
          limiter_P:
            size: 2
            doc: Extreme values of the pressure among the neighbours
          maxr:
            doc: Maximal distance to all neighbouring faces

      force:
        type: struct
        contents:
          h_dt:
            doc: Needed to drift the primitive variables

  flux:
    type: struct
    doc: Fluxes. No mass flux, since it is always zero.
    contents:

      flux_momentum:
        size: 3
        doc: Momentum flux
      flux_energy:
        doc: Energy flux
      flux_dt:
        doc: Particle time step. Used to compute time-integrated fluxes

  gradients:
    type: struct
    doc: Gradients of the primitive variables
    contents:
      grad_rho:
        size: 3
        doc: Density gradients
      grad_v:
        size: 3,3
        doc: Fluid velocity gradients
      grad_P:
        size: 3
        doc: Pressure gradients

  conserved:
    type: struct
    doc: The conserved hydrodynamical variables.
    contents:
      union_mass:
        type: union
        doc: Mass and conserved mass is the same. Use union to be both explicit in naming and to have required field available.
        contents:
          mass:
            doc: Fluid mass
          conserved_mass:
            doc: Fluid mass
      conserved_momentum:
        size: 3
        doc: Fluid momentum
      conserved_energy:
        doc: Fluid thermal energy (not per unit mass!)

  geometry:
    type: struct fvpm_geometry_struct
    doc: Geometrical quantities used for hydro

  timestepvars:
    type: struct
    doc: Variables used for timestep calculation
    contents:
      vmax:
        doc: |
          Maximum signal velocity among all the neighbours of the particle. The
          signal velocity encodes information about the relative fluid
          velocities AND particle velocities of the neighbour and this particle, as well
          as the sound speed of both particles.

  adaptive_softening_data:
    type: struct adaptive_softening_part_data
    doc: Additional data used for adaptive softening

  mhd_data:
    type: struct mhd_part_data
    doc: Additional data used by the MHD scheme

  chemistry_data:
    type: struct chemistry_part_data 
    doc: Chemistry information

  cooling_data:
    type: struct cooling_part_data
    doc: Cooling information

  feedback_data:
    type: struct feedback_part_data
    doc: Additional data used by the feedback

  black_holes_data:
    type: struct black_holes_part_data
    doc: Black holes information (eg swallowing ID)

  sink_data:
    type: struct sink_part_data
    doc: Sink information (eg swallowing ID)

  pressure_floor_data:
    type: struct pressure_floor_part_data
    doc: Additional data used by the pressure floor

  rt_data:
    type: struct rt_part_data
    doc: Additional Radiative Transfer Data

  rt_time_data:
    type: struct rt_timestepping_data
    doc: RT sub-cycling time stepping data

  depth_h:
    doc: Tree-depth at which size / 2 <= h * gamma < size
    type: char

  time_bin:
    type: timebin_t
    doc: Time-step length

  timestep_limiter:
    type: struct timestep_limiter_data
    doc: Time-step limiter information

  ti_drift:
    type: integertime_t
    doc: Time of the last drift
    ifdef: SWIFT_DEBUG_CHECKS

  ti_kick:
    type: integertime_t
    doc: Time of the last drift
    ifdef: SWIFT_DEBUG_CHECKS


xpart:
  doc: |
    Particle fields not needed during the SPH loops over neighbours.

    This structure contains the particle fields that are not used in the
    density or force loops. Quantities should be used in the kick, drift and
    potentially ghost tasks only.

  x_diff:
    size: 3
    doc: "Offset between current position and position at last tree rebuild."

  x_diff_sort:
    size: 3
    doc: "Offset between the current position and position at the last sort."

  v_full:
    size: 3
    doc: "Velocity at the last full step."

  a_grav:
    size: 3
    doc: "Gravitational acceleration at the end of the last step"

  extra_split_data:
    type: struct particle_splitting_data split_data
    doc: "Additional data used to record particle splits"

  extra_cooling_data:
    type: struct cooling_xpart_data
    doc: "Additional data used to record cooling information"

  extra_tracers_data:
    type: struct tracers_xpart_data
    doc: "Additional data used by the tracers"

  extra_sf_data:
    type: struct star_formation_xpart_data
    doc: "Additional data used by the tracers"

  extra_feedback_data:
    type: struct feedback_xpart_data
    doc: "Additional data used by the feedback"

  extra_mhd_data:
    type: struct mhd_xpart_data
    doc: "Additional data used by the MHD scheme"

  extra_forcing_data:
    type: struct forcing_xpart_data
    doc: "Additional data used by the forcing scheme"
 
  csds_data:
    type: struct csds_part_data
    doc: "Additional data for the particle csds"
    ifdef: WITH_CSDS
